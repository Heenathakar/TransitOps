{% extends 'base.html' %}


{% block content %}


<div class="container mt-4">


<h2>Maintenance Management</h2>


<a href="{% url 'maintenance_add' %}"
class="btn btn-primary">

Add Maintenance

</a>



<table class="table table-bordered mt-3">


<tr>

<th>Vehicle</th>
<th>Date</th>
<th>Description</th>
<th>Cost</th>

</tr>


{% for item in data %}


<tr>

<td>
{{item.vehicle}}
</td>


<td>
{{item.date}}
</td>


<td>
{{item.description}}
</td>


<td>
{{item.cost}}
</td>


</tr>


{% empty %}

<tr>

<td colspan="4">
No Maintenance Records
</td>

</tr>


{% endfor %}


</table>


</div>


{% endblock %}
